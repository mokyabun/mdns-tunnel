version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      patch:
        update-types: [patch]

  # The rust image tag in the Dockerfile; rust-toolchain.toml below picks the compiler.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      patch:
        update-types: [patch]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
