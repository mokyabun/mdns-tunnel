name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore: ["**/*.md"]
  # Pushes to main warm the caches that pull requests restore.
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

  image:
    name: Build image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # interface_name in the test compose file needs Docker Engine 28.1, newer than the runner's.
      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Start the test network
        run: docker compose -f tests/e2e/compose.yml up -d --build

      - name: Run the test
        run: tests/e2e/e2e.py

      - name: Show logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yml logs
