name: Release binaries

on:
  workflow_call:

permissions: {}

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # No build cache: a release must not restore layers a less trusted workflow could have written.
      - name: Build binaries
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: export
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=out

      - name: Name binaries
        run: |
          mkdir dist
          cp out/linux_amd64/mdns-tunnel dist/mdns-tunnel-x86_64-linux-musl
          cp out/linux_arm64/mdns-tunnel dist/mdns-tunnel-aarch64-linux-musl

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 1

  openwrt:
    name: Build OpenWrt ${{ matrix.release }} package
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        # 24.10 builds an .ipk, 25.12 an .apk.
        release: ["24.10", "25.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: binaries
          path: dist

      - name: Build the package in the SDK
        run: |
          # The SDK runs as buildbot, not as the runner's user.
          mkdir out && chmod 777 out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            "$SDK_IMAGE" bash -euc '
              ./setup.sh
              ln -s /src/openwrt/mdns-tunnel package/mdns-tunnel
              make defconfig
              make package/mdns-tunnel/compile V=s PKG_VERSION="$VERSION" \
                MDNS_TUNNEL_BIN=/src/dist/mdns-tunnel-aarch64-linux-musl
              find bin/packages -name "mdns-tunnel*" -exec cp {} /out/ \;
            '
        env:
          SDK_IMAGE: openwrt/sdk:mediatek-filogic-openwrt-${{ matrix.release }}

      - name: Upload the package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openwrt-${{ matrix.release }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Attach to the release
    needs: openwrt
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Upload to the release
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/assets/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
