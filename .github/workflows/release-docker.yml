name: Release image

on:
  workflow_call:

permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # release follows the newest stable version, so pre-releases skip it and vX.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          # GHCR reads the package description from the index annotations of multi-arch images.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=release,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: a release must not restore layers a less trusted workflow could have written.
      # BuildKit attestations would show up as unknown/unknown images on GHCR; GitHub attestations replace them.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  cleanup:
    name: Delete untagged images
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # Keeps platform images that a tagged multi-arch index still references.
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          delete-untagged: true
